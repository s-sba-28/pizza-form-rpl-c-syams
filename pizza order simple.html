<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Your Pizza</title>
    <link rel="icon" type="image/png" href="pizza icon.png">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffdd7a 0%, #ff8c42 100%);
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.15);
            max-width: 420px;
            width: 100%;
            padding: 28px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 28px;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 16px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .toppings {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .toppings label {
            font-weight: normal;
        }

        .toppings input {
            margin-right: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #ff6f3c;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #e65a26;
        }

        .note {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pizza Order</h1>
        <form>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>

            <label for="size">Pizza Size</label>
            <select id="size" name="size" required>
                <option value="">Choose size</option>
                <option value="small">Small</option>
                <option value="medium">Medium</option>
                <option value="large">Large</option>
            </select>

            <label>Toppings</label>
            <div class="toppings">
                <label><input type="checkbox" name="toppings" value="pepperoni"> Pepperoni</label>
                <label><input type="checkbox" name="toppings" value="mushrooms"> Mushrooms</label>
                <label><input type="checkbox" name="toppings" value="onions"> Onions</label>
                <label><input type="checkbox" name="toppings" value="bell peppers"> Bell peppers</label>
                <label><input type="checkbox" name="toppings" value="olives"> Olives</label>
                <label><input type="checkbox" name="toppings" value="extra cheese"> Extra cheese</label>
            </div>

            <label for="notes">Special instructions</label>
            <textarea id="notes" name="notes" rows="3" placeholder="E.g. no onions, extra crispy"></textarea>

            <button type="submit">Place Order</button>
        </form>
        <p class="note">This is a simple pizza order form. No backend is connected.</p>
    </div>
</body>
</html>
